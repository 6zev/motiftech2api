name: Release smoke test

# Runs after Publish creates a release: downloads the published assets and checks
# that they actually work. A release that cannot start is worse than none.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to smoke test (for example v1.0.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    name: download and run published binary
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the linux/amd64 asset and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -eu
          mkdir -p dl
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern 'motiftech2api_*_linux_amd64' \
            --pattern 'checksums.txt' \
            --dir dl
          ls -l dl

      - name: Verify checksum
        working-directory: dl
        run: |
          set -eu
          grep ' linux_amd64$' checksums.txt > expected
          sha256sum -c expected

      - name: Run it
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -eu
          bin=$(ls dl/motiftech2api_*_linux_amd64)
          chmod +x "$bin"

          reported=$("$bin" --version)
          echo "reports: $reported"
          [ "$reported" = "$TAG" ] || {
            echo "::error::binary reports '$reported' but the release is '$TAG'"
            exit 1
          }

          PORT=38111 STORE_PATH="$RUNNER_TEMP/conv.json" "$bin" &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT

          for _ in $(seq 1 50); do
            if curl -sf localhost:38111/health > /dev/null; then break; fi
            sleep 0.1
          done

          curl -sf localhost:38111/health | tee health.json
          grep -q '"ok"' health.json

          curl -sf localhost:38111/v1/models > models.json
          grep -q 'motif-12-7b' models.json
          grep -q 'motif-12-7b-reasoning' models.json

          echo "smoke test passed for $TAG"
